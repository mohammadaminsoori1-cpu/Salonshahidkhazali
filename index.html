<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سالن تشریفات شهید خزعلی</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(145deg,#0b0b0b,#191919);
    color:#f5f2ec; min-height:100vh;
  }
  .wrap{max-width:520px;margin:auto;padding:28px 18px 40px}
  .card{
    background:rgba(25,25,25,.94); border:1px solid #4b3a20;
    border-radius:24px; padding:28px 20px;
    box-shadow:0 15px 45px rgba(0,0,0,.45);
  }
  .orn{color:#d6aa58;text-align:center;font-size:28px;margin-bottom:8px}
  h1{margin:0;text-align:center;font-size:30px;color:#e1b965}
  h2{margin:8px 0 0;text-align:center;font-size:17px;font-weight:normal;color:#ddd}
  .welcome{text-align:center;line-height:2;margin:28px 0;color:#eee}
  .info{margin-top:18px}
  .item{
    display:block;text-decoration:none;color:#fff;
    border:1px solid #40382c;background:#171717;
    border-radius:16px;padding:17px 16px;margin:12px 0;
    transition:.2s;
  }
  .item:hover{transform:translateY(-2px);border-color:#b9914a}
  .label{display:block;color:#d8ad5b;font-size:14px;margin-bottom:6px}
  .value{font-size:17px}
  .map{background:#d8ad5b;color:#111;border-color:#d8ad5b;text-align:center;font-weight:bold}
  .map .label{color:#3b2a12}
  .footer{text-align:center;color:#aaa;margin-top:28px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="orn">✦</div>
    <h1>سالن تشریفات شهید خزعلی</h1>
    <h2>برگزاری مراسم ختم</h2>

    <div class="welcome">
      با نهایت احترام،<br>
      حضور شما را در مراسم عزیزان گرامی می‌داریم.<br>
      <strong>خوش آمدید</strong>
    </div>

    <div class="info">
      <div class="item">
        <span class="label">📍 آدرس</span>
        <span class="value">قم، آرامگاه بهشت معصومه</span>
      </div>

      <a class="item" href="tel:09195130962">
        <span class="label">📞 شماره تماس</span>
        <span class="value">۰۹۱۹۵۱۳۰۹۶۲</span>
      </a>

      <a class="item map" href="https://maps.app.goo.gl/UUWivGruUeLkBRc87" target="_blank" rel="noopener">
        <span class="label">🗺️ مسیریابی</span>
        <span class="value">مشاهده لوکیشن در نقشه</span>
      </a>
    </div>

    <div class="footer">در کنار شما هستیم...</div>
  </div>
</div>
</body>
</html>
